[project]
name = "hf-aws"
version = "0.1.0"
description = "Hugging Face CLI extension to plan and deploy Hub models on Amazon SageMaker AI."
readme = "README.md"
authors = [{ name = "Enrique Hernández Calabrés", email = "ehcalabres@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.42.36,<2",
    "huggingface-hub>=1.3.4,<3",
    "rich>=13.9.4,<16",
    "rich-argparse>=1.7.2,<2",
    "sagemaker-core>=2.29.0,<3",
    "sagemaker-serve>=1.29.0,<2",
]

[project.urls]
Homepage = "https://github.com/ehcalabres/hf-aws"
Issues = "https://github.com/ehcalabres/hf-aws/issues"

[project.scripts]
hf-aws = "hf_aws.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.9.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
